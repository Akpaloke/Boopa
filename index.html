<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Boopa — Find Your People</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --primary:#3730A3;
    --primary-dark:#2A2482;
    --primary-soft:#F1F0FA;
    --accent:#131316;
    --accent-ink:#FFFFFF;
    --bg:#FBFBFC;
    --surface:#FFFFFF;
    --text:#131316;
    --text-muted:#78767F;
    --border:#E7E6EA;
    --success:#1B9C63;
    --success-soft:#E7F7EF;
    --danger:#C0392B;
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:16px;
    --font-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
    --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#111013;--surface:#19181C;--text:#F3F2F5;--text-muted:#9A98A2;--border:#2C2A30;--primary-soft:#221F3D;--accent:#F3F2F5;--accent-ink:#131316;
    }
  }
  :root[data-theme="dark"]{--bg:#111013;--surface:#19181C;--text:#F3F2F5;--text-muted:#9A98A2;--border:#2C2A30;--primary-soft:#221F3D;--accent:#F3F2F5;--accent-ink:#131316;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-width:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  #root{min-height:100vh;}
  h1{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
  h2,h3,h4{font-family:var(--font-body);font-weight:600;margin:0;letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:var(--font-body);cursor:pointer;touch-action:manipulation;}
  a{color:inherit;text-decoration:none;}
  input,select{font-family:var(--font-body);max-width:100%;}
  button,input,select{transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease,color .2s ease,transform .2s ease,opacity .2s ease;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 28%,transparent);outline-offset:2px;}

  /* ---- brand ---- */
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:9px;letter-spacing:-0.01em;}
  .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);flex-shrink:0;}

  /* ---- Landing ---- */
  .landing{min-height:100vh;display:flex;flex-direction:column;background:var(--surface);position:relative;isolation:isolate;overflow:hidden;}
  .landing::before,.landing::after{content:"";position:absolute;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(10px);will-change:transform,opacity;}
  .landing::before{width:min(58vw,720px);height:min(58vw,720px);left:50%;top:43%;background:radial-gradient(circle,color-mix(in srgb,var(--primary) 13%,transparent) 0%,transparent 68%);transform:translate(-50%,-50%);animation:landing-glow 16s ease-in-out infinite alternate;opacity:.7;}
  .landing::after{width:min(35vw,460px);height:min(35vw,460px);right:-14%;top:8%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 9%,transparent) 0%,transparent 70%);animation:landing-orbit 22s ease-in-out infinite alternate;opacity:.45;}
  .landing-nav{padding:26px 6vw;animation:landing-nav-in .45s cubic-bezier(.2,.8,.2,1) both;}
  .landing-nav .wordmark{transition:transform .25s ease,opacity .25s ease;}
  .landing-nav .wordmark:hover{transform:translateY(-1px);}
  .landing-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:6vh 6vw;position:relative;}
  .landing-mid::before{content:"";position:absolute;width:min(38vw,520px);height:min(38vw,520px);border:1px solid color-mix(in srgb,var(--text) 4%,transparent);border-radius:50%;opacity:.35;animation:landing-ring 20s linear infinite;pointer-events:none;}
  .landing-box{max-width:440px;text-align:center;animation:hero-breathe 8s ease-in-out 2.15s infinite;}
  .landing-box h1,.landing-box .tagline,.landing-box .pitch,.landing-lines span,.landing-cta button{opacity:0;animation:hero-item-in .65s cubic-bezier(.2,.8,.2,1) both;}
  .landing-box h1{font-size:clamp(34px,5.4vw,46px);line-height:1.08;font-weight:600;animation-delay:.42s;}
  .landing-box .tagline{font-size:15.5px;color:var(--text-muted);margin-top:8px;animation-delay:.62s;}
  .landing-box .pitch{font-size:15.5px;line-height:1.65;margin-top:24px;color:var(--text);max-width:36ch;margin-left:auto;margin-right:auto;animation-delay:.82s;}
  .landing-lines{margin-top:20px;display:flex;flex-direction:column;gap:3px;}
  .landing-lines span{font-size:12.5px;color:var(--text-muted);}
  .landing-lines span:first-child{animation-delay:1.04s;}
  .landing-lines span:last-child{animation-delay:1.12s;}
  .landing-cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:32px;}
  .cta-primary{background:var(--text);color:var(--surface);border:none;padding:13px 30px;border-radius:9px;font-weight:600;font-size:14.5px;min-height:46px;position:relative;overflow:hidden;box-shadow:0 8px 28px color-mix(in srgb,var(--text) 9%,transparent);animation-delay:1.32s!important;}
  .cta-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 28%,color-mix(in srgb,var(--surface) 20%,transparent) 48%,transparent 68%);transform:translateX(-125%);transition:transform .65s ease;}
  .cta-primary:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 12px 32px color-mix(in srgb,var(--text) 18%,transparent);}
  .cta-primary:hover::after{transform:translateX(125%);}
  .cta-primary:active{transform:translateY(0) scale(.975);}
  .cta-secondary{background:none;border:none;color:var(--text-muted);font-size:13.5px;font-weight:600;text-decoration:none;text-underline-offset:3px;position:relative;padding:4px 0;animation-delay:1.52s!important;}
  .cta-secondary::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:currentColor;transform:scaleX(.35);transform-origin:right center;transition:transform .25s ease,opacity .25s ease;opacity:.65;}
  .cta-secondary:hover{color:var(--text);transform:translateY(-1px);}
  .cta-secondary:hover::after,.cta-secondary:focus-visible::after{transform:scaleX(1);transform-origin:left center;opacity:1;}
  .landing-foot{padding:22px;text-align:center;font-size:11.5px;color:var(--text-muted);}
  @keyframes landing-nav-in{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes hero-item-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes hero-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes landing-glow{from{transform:translate(-50%,-50%) scale(.92);opacity:.45}to{transform:translate(-47%,-52%) scale(1.08);opacity:.8}}
  @keyframes landing-orbit{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(-8%,12%,0) scale(1.08)}}
  @keyframes landing-ring{from{transform:rotate(0deg) scale(.96)}to{transform:rotate(360deg) scale(1.04)}}
  @media(prefers-reduced-motion:reduce){
    .landing::before,.landing::after,.landing-mid::before,.landing-box{animation:none!important;}
    .landing-nav,.landing-box h1,.landing-box .tagline,.landing-box .pitch,.landing-lines span,.landing-cta button{animation:none!important;opacity:1!important;}
  }

  /* ---- Auth ---- */
  .auth-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .auth-top{padding:22px 6vw;display:flex;align-items:center;gap:14px;}
  .back-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);flex:0 0 auto;}
  .auth-mid{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:2vh 6vw 6vh;}
  .auth-card{width:100%;max-width:420px;}
  .auth-card h2{font-size:27px;}
  .auth-card .sub{color:var(--text-muted);font-size:14px;margin-top:6px;}
  .pfp-upload{margin:26px 0 6px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .pfp-circle{width:84px;height:84px;border-radius:50%;background:var(--primary-soft);border:1.5px dashed var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;overflow:hidden;position:relative;}
  .pfp-circle img{width:100%;height:100%;object-fit:cover;}
  .pfp-upload .hint{font-size:12.5px;color:var(--text-muted);}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input,.field select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--text);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--primary);}
  .submit-btn{width:100%;background:var(--text);color:var(--surface);border:none;border-radius:9px;padding:13px;font-weight:600;font-size:14.5px;margin-top:8px;}
  .field-note{font-size:12px;color:var(--text-muted);margin-top:-8px;margin-bottom:16px;line-height:1.5;}
  .auth-switch{text-align:center;margin-top:20px;font-size:13.5px;color:var(--text-muted);}
  .auth-switch button{background:none;border:none;color:var(--primary);font-weight:700;font-size:13.5px;}

  /* ---- App shell ---- */
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .app-top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 6vw;display:flex;align-items:center;gap:14px;}
  .app-content{flex:1;max-width:920px;margin:0 auto;width:100%;padding:24px 6vw calc(100px + env(safe-area-inset-bottom));}
  .app-content.chat-mode{height:calc(100dvh - 73px);min-height:0;padding-top:12px;padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow:hidden;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10;}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text-muted);font-size:11px;font-weight:600;padding:7px 6px;border-radius:10px;min-height:48px;}
  .bottom-nav button.active{color:var(--primary);}

  .page-head{margin-bottom:20px;}
  .page-head h2{font-size:24px;}
  .page-head p{color:var(--text-muted);margin-top:5px;font-size:14px;}
  .row-back{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .row-back h2{font-size:21px;}

  .search-box{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 15px;margin-bottom:14px;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;}
  .search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 10%,transparent);}
  .search-box input{border:none;outline:none;background:transparent;color:var(--text);font-size:14.5px;width:100%;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .filter-row select{padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-muted);min-height:40px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--text-muted);min-height:40px;}
  .chip.active{background:var(--text);color:var(--surface);border-color:var(--text);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:17px;}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;color:#fff;flex-shrink:0;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .verified-badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#2563EB;color:#fff;font-size:11px;font-weight:700;vertical-align:middle;margin-left:5px;box-shadow:0 0 0 2px var(--surface);animation:badge-in .35s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes badge-in{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
  .verification-card{border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;margin-top:20px;background:var(--surface);}
  .verification-card h3{display:flex;align-items:center;gap:7px;font-size:16px;}
  .verification-card p{font-size:13px;color:var(--text-muted);line-height:1.55;margin-top:7px;}
  .verification-card ul{padding-left:18px;margin:13px 0;color:var(--text-muted);font-size:13px;line-height:1.8;}
  .verification-status{font-size:12.5px;margin-top:10px;color:var(--text-muted);}
  .verification-status.success{color:var(--success);}.verification-status.error{color:var(--danger);}
  .edit-fields{margin-top:20px;border-top:1px solid var(--border);padding-top:18px;}
  .motion-in{animation:route-in .4s cubic-bezier(.2,.8,.2,1) both;will-change:opacity,transform;}
  .stagger-in{animation:row-in .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--item-index, 0) * 45ms);will-change:opacity,transform;}
  .clickable{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background-color .22s ease;}
  .submit-btn,.wa-btn,.cta-primary,.back-btn,.chip,.cta-secondary{transition:transform .18s ease,box-shadow .2s ease,background-color .2s ease,color .2s ease,opacity .2s ease;}
  .submit-btn:active,.wa-btn:active,.cta-primary:active,.back-btn:active,.chip:active,.cta-secondary:active,.bottom-nav button:active{transform:scale(.97);}
  .submit-btn:disabled,.wa-btn:disabled{cursor:wait;opacity:.65;}
  .toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:13px;z-index:20;animation:toast-in .3s cubic-bezier(.2,.8,.2,1) both;max-width:min( calc(100vw - 32px), 420px);text-align:center;}
  .skeleton{height:52px;border-radius:10px;background:linear-gradient(100deg,var(--bg) 20%,var(--border) 40%,var(--bg) 60%);background-size:250% 100%;animation:shimmer 1.3s ease-in-out infinite;}
  .avatar img,.pfp-circle img{animation:image-in .35s ease both;}
  @keyframes route-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes row-in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  @keyframes image-in{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes shimmer{to{background-position:-200% 0}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  .list{display:flex;flex-direction:column;}
  .row-item{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--border);cursor:pointer;min-width:0;}
  .row-item:hover{background:var(--bg);}
  .row-text{flex:1;min-width:0;}
  .row-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-tag{flex-shrink:0;font-size:11px;color:var(--text-muted);border:1px solid var(--border);padding:3px 8px;border-radius:6px;}
  .row-item svg{color:var(--text-muted);flex-shrink:0;}

  .comm-mark{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--surface);font-family:var(--font-display);font-weight:600;font-size:15px;flex-shrink:0;}

  .notice-banner{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:18px;min-width:0;}
  .notice-banner>div:last-child{min-width:0;}
  .notice-banner b{font-size:13px;display:block;font-weight:600;}
  .notice-banner span{font-size:12.5px;color:var(--text-muted);}
  .feed-item{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--border);min-width:0;animation:row-in .4s cubic-bezier(.2,.8,.2,1) both;}
  .feed-item>div:last-child{min-width:0;overflow-wrap:anywhere;}
  .feed-item .fi-body{font-size:13.5px;line-height:1.55;margin-top:3px;}
  .feed-item .fi-meta{font-size:12px;color:var(--text-muted);margin-top:6px;}

  .profile-card{max-width:420px;margin:0 auto;}
  .chat-shell{max-width:720px;width:100%;height:100%;min-height:0;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px color-mix(in srgb,var(--text) 7%,transparent);}
  .chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 94%,var(--primary-soft));}
  .chat-head .back-btn{flex-shrink:0;}
  .chat-status{font-size:12px;color:var(--success);margin-top:3px;}
  .chat-body{flex:1;display:flex;flex-direction:column;gap:8px;padding:20px 16px;overflow-y:auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .chat-empty{margin:auto;text-align:center;color:var(--text-muted);padding:24px;}
  .chat-empty .avatar{margin:0 auto 12px;}
  .chat-bubble-row{display:flex;width:100%;}
  .chat-bubble-row.mine{justify-content:flex-end;}
  .chat-bubble{max-width:min(76%,520px);padding:10px 13px;border-radius:16px 16px 16px 5px;background:var(--primary-soft);color:var(--text);overflow-wrap:anywhere;}
  .chat-bubble-row.mine .chat-bubble{border-radius:16px 16px 5px 16px;background:var(--success);color:#fff;}
  .chat-time{font-size:10px;opacity:.68;margin-top:5px;}
  .chat-composer{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface);}
  .chat-composer input{flex:1;min-width:0;border:1px solid var(--border);border-radius:22px;padding:12px 15px;background:var(--bg);color:var(--text);}
  .chat-composer .submit-btn{width:auto;margin:0;border-radius:22px;padding:11px 18px;}
  .push-setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border);margin-top:18px;}
  .push-setting p{font-size:12px;color:var(--text-muted);line-height:1.45;margin-top:4px;}
  .push-toggle{width:52px;height:30px;border:0;border-radius:20px;background:var(--border);padding:3px;flex-shrink:0;}
  .push-toggle span{display:block;width:24px;height:24px;border-radius:50%;background:var(--text-muted);transition:transform .2s ease,background .2s ease;}
  .push-toggle.on{background:var(--success);}
  .push-toggle.on span{transform:translateX(22px);background:#fff;}
  .push-toggle:disabled{opacity:.45;cursor:not-allowed;}
  @media(max-width:640px){.app-content.chat-mode{height:calc(100dvh - 67px);padding:8px 0 calc(70px + env(safe-area-inset-bottom));}.chat-shell{border-left:0;border-right:0;border-radius:0;box-shadow:none;}.chat-body{padding:16px 12px;}.chat-bubble{max-width:84%;}}
  .profile-pfp{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 22px;}
  .profile-pfp h2{font-size:22px;margin-top:14px;}
  .profile-pfp .department{font-size:14.5px;font-weight:500;margin-top:4px;}
  .profile-pfp .university{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .info-row span:first-child{color:var(--text-muted);}
  .info-row:last-child{border-bottom:none;}
  .wa-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--success);color:#fff;border:none;border-radius:9px;padding:13px;font-weight:600;font-size:14px;margin-top:20px;}

</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect} = React;
const BOOPA_CONFIG = window.BOOPA_CONFIG || {};
const supabaseClient = (() => {
  if(!BOOPA_CONFIG.supabaseUrl || !BOOPA_CONFIG.supabasePublishableKey) return null;
  try {
    const url = new URL(BOOPA_CONFIG.supabaseUrl);
    if(url.protocol !== "https:" || !window.supabase?.createClient) throw new Error("Invalid Supabase deployment configuration.");
    return window.supabase.createClient(url.toString().replace(/\/$/,""), BOOPA_CONFIG.supabasePublishableKey);
  } catch(error) {
    console.error("Boopa Supabase initialization failed:", error.message);
    return null;
  }
})();
const PROFILE_TABLE = "profiles";
const getSession = async () => supabaseClient ? (await supabaseClient.auth.getSession()).data.session : null;
const pushDiagnostics = () => {
  const checks={secure:window.isSecureContext||location.hostname==="localhost",notification:"Notification" in window,serviceWorker:"serviceWorker" in navigator,push:"PushManager" in window,configured:!!BOOPA_CONFIG.pushVapidPublicKey};
  Object.entries(checks).forEach(([name,ok])=>console.debug(`[Boopa Push] ${name}: ${ok?"supported":"unavailable"}`));
  if(!checks.secure||!checks.notification||!checks.serviceWorker||!checks.push) return {status:"UNSUPPORTED",message:"Push notifications aren't supported on this browser."};
  if(!checks.configured) return {status:"UNSUPPORTED",message:"Push notifications are not configured for this deployment."};
  if(Notification.permission==="denied") return {status:"BLOCKED",message:"Notifications are blocked in your browser. Enable them in your browser settings."};
  return {status:Notification.permission==="granted"?"SUPPORTED":"PERMISSION_REQUIRED",message:""};
};
const getPushState = async userId => {
  const base=pushDiagnostics();
  if(base.status==="UNSUPPORTED"||base.status==="BLOCKED") return {...base,enabled:false};
  try {
    const registration=await navigator.serviceWorker.register("/service-worker.js");
    const subscription=await registration.pushManager.getSubscription();
    console.debug(`[Boopa Push] Permission: ${Notification.permission}`,`[Boopa Push] Subscription: ${subscription?"active":"inactive"}`);
    if(!subscription) return {...base,status:Notification.permission==="granted"?"SUPPORTED":"PERMISSION_REQUIRED",enabled:false};
    const {data,error}=await requireClient().from("push_subscriptions").select("id").eq("user_id",userId).eq("endpoint",subscription.endpoint).maybeSingle();
    if(error) throw error;
    return {...base,status:data?"ENABLED":"SUPPORTED",enabled:!!data,subscription};
  } catch(error) {
    console.error("[Boopa Push] Subscription check failed:",error);
    return {status:"SUPPORTED",enabled:false,message:"Notifications are allowed, but this device could not create a push subscription. Please try again."};
  }
};
const setPushEnabled = async (userId,enabled) => {
  const base=pushDiagnostics();
  if(!enabled) {
    const registration=await navigator.serviceWorker.getRegistration("/service-worker.js");
    const subscription=registration&&await registration.pushManager.getSubscription();
    if(subscription){await subscription.unsubscribe();await requireClient().from("push_subscriptions").delete().eq("user_id",userId).eq("endpoint",subscription.endpoint);}
    return {status:"SUPPORTED",enabled:false,message:""};
  }
  if(base.status==="BLOCKED"||base.status==="UNSUPPORTED") return {...base,enabled:false};
  try {
    if(Notification.permission==="default"){
      const permission=await Notification.requestPermission();
      if(permission!=="granted") return {status:permission==="denied"?"BLOCKED":"PERMISSION_REQUIRED",enabled:false,message:permission==="denied"?"Notifications are blocked. Please enable them in your browser settings.":"Notification permission was not granted."};
    }
    const registration=await navigator.serviceWorker.register("/service-worker.js");
    const bytes=Uint8Array.from(atob(BOOPA_CONFIG.pushVapidPublicKey.replace(/-/g,"+").replace(/_/g,"/")+"=="),char=>char.charCodeAt(0));
    const subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});
    const json=subscription.toJSON();
    const {error}=await requireClient().from("push_subscriptions").upsert({user_id:userId,endpoint:json.endpoint,p256dh:json.keys?.p256dh,auth:json.keys?.auth,updated_at:new Date().toISOString()},{onConflict:"user_id,endpoint"});
    if(error) throw error;
    console.debug("[Boopa Push] Subscription: active");
    return {status:"ENABLED",enabled:true,message:""};
  } catch(error) {
    console.error("[Boopa Push] Subscription failed:",error);
    return {status:"SUPPORTED",enabled:false,message:"Notifications are allowed, but this device could not create a push subscription. Please try again."};
  }
};
const pushSupportMessage = () => {
  const state=pushDiagnostics();
  return state.message;
};
const requireClient = () => {
  if (!supabaseClient) throw new Error("Supabase is not configured for this deployment.");
  return supabaseClient;
};
const authErrorMessage = error => {
  if (error?.name === "TypeError" && error.message === "Failed to fetch") return "Unable to connect to Supabase authentication. Check the deployed Supabase URL and publishable key.";
  if (error?.message === "Invalid login credentials") return "Incorrect email or password.";
  if (error?.message?.toLowerCase().includes("user already registered")) return "An account with this email already exists. Please log in.";
  return error?.message || "Authentication failed. Please try again.";
};
const normalizeProfile = profile => profile ? {...profile,isVerified:profile.is_verified || profile.verification_status==="active",full_name:profile.full_name||"",university:profile.university||"",department:profile.department||"",avatar_url:profile.avatar_url||""} : profile;

/* ---------- helpers ---------- */
const PALETTE = ["#2E22C9","#E0553B","#1B9C63","#B4257A","#0E8FA6","#8A5CF6","#C97A1E"];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return h;}
const colorFor = (seed) => PALETTE[Math.abs(hash(seed)) % PALETTE.length];
function initials(name){return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();}

const Icon = ({name,size=19}) => {
  const s = {width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"1.8",strokeLinecap:"round",strokeLinejoin:"round"};
  switch(name){
    case "compass": return <svg {...s}><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6z"/></svg>;
    case "users": return <svg {...s}><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M21 20c0-2.6-1.8-4.8-4.2-5.6"/></svg>;
    case "feed": return <svg {...s}><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="4" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="14" width="7" height="6" rx="1.5"/></svg>;
    case "user": return <svg {...s}><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>;
    case "search": return <svg {...s}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;
    case "bell": return <svg {...s}><path d="M6 10a6 6 0 1112 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10z"/><path d="M10 18.5a2 2 0 004 0"/></svg>;
    case "camera": return <svg {...s}><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.3"/></svg>;
    case "arrow-left": return <svg {...s}><path d="M19 12H5M11 6l-6 6 6 6"/></svg>;
    case "whatsapp": return <svg viewBox="0 0 24 24" width={size} height={size} fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.3-2.9c-.2-.3.2-.3.5-1 .1-.1.1-.3 0-.4-.1-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3 1 2.5c.1.1 1.7 2.6 4.1 3.6.6.2 1 .4 1.4.5.6.2 1.1.1 1.5.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.5-.3z"/></svg>;
    case "logo": return <svg viewBox="0 0 24 24" width={size} height={size}><circle cx="7.5" cy="8" r="2.7" fill="currentColor"/><circle cx="16.5" cy="16" r="2.7" fill="currentColor"/><line x1="9.5" y1="9.8" x2="14.5" y2="14.2" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"/></svg>;
    case "chevron": return <svg {...s}><path d="M9 6l6 6-6 6"/></svg>;
    default: return null;
  }
};

const Wordmark = () => (
  <div className="wordmark">
    <span className="mark"><Icon name="logo" size={15}/></span>Boopa
  </div>
);

const VerifiedBadge = () => <span className="verified-badge" title="Verified on Boopa" aria-label="Verified">✓</span>;
const authHeaders = async () => {
  const client=requireClient();
  const {data,error}=await client.auth.getSession();
  if(error) throw error;
  if(!data.session?.access_token) throw new Error("Please log in before subscribing for verification.");
  return {Authorization:"Bearer "+data.session.access_token,"apikey":BOOPA_CONFIG.supabasePublishableKey};
};
const Avatar = ({name,size=44,photo}) => (
  <div className="avatar" style={{width:size,height:size,background:photo?"transparent":"var(--text)",fontSize:size*0.36}}>
    {photo ? <img src={photo} alt=""/> : initials(name)}
  </div>
);

const EmptyState = ({icon,title,body}) => (
  <div className="empty-state">
    <div className="glyph"><Icon name={icon} size={24}/></div>
    <h4>{title}</h4>
    <p>{body}</p>
  </div>
);

/* ---------- profile form options ---------- */
const LEVELS = ["100","200","300","400","500"];

/* ---------- Landing ---------- */
function Landing({onSignup,onLogin}){
  return (
    <div className="landing">
      <div className="landing-nav"><Wordmark/></div>
      <div className="landing-mid">
        <div className="landing-box">
          <h1>Boopa</h1>
          <div className="tagline">Find your people.</div>
          <p className="pitch">Meet students who share your ambitions — coursemates, project partners, and the people in your community.</p>
          <div className="landing-lines">
            <span>Discover like-minded people</span>
            <span>Made by students, for students</span>
          </div>
          <div className="landing-cta">
            <button className="cta-primary" onClick={onSignup}>Join us</button>
            <button className="cta-secondary" onClick={onLogin}>Already on Boopa? Log in</button>
          </div>
        </div>
      </div>
      <div className="landing-foot">© 2026 Boopa</div>
    </div>
  );
}

/* ---------- Sign up ---------- */
function SignUp({onBack,onDone}){
  const [photo,setPhoto] = useState(null);
  const [name,setName] = useState("");
  const [level,setLevel] = useState(LEVELS[0]);
  const [department,setDepartment] = useState("");
  const [university,setUniversity] = useState("");
  const [number,setNumber] = useState("");
  const [email,setEmail] = useState("");
  const [password,setPassword] = useState("");
  const [error,setError] = useState("");
  const [saving,setSaving] = useState(false);
  const fileRef = useRef(null);

  const pickPhoto = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => setPhoto(reader.result);
    reader.readAsDataURL(file);
  };

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    const fullName=name.trim(); const emailValue=email.trim(); const universityValue=university.trim(); const departmentValue=department.trim();
    const numericLevel=Number(level); const numberValue=number.trim();
    if(!fullName||!emailValue||password.length<8||!universityValue||!departmentValue||!numberValue||![100,200,300,400,500].includes(numericLevel)){setError("Complete every field using a valid level from 100 to 500.");return;}
    setSaving(true);
    try{
      const client=requireClient();
      const {data:authData,error:authError}=await client.auth.signUp({email:emailValue,password,options:{data:{full_name:fullName,university:universityValue,department:departmentValue,level:numericLevel,number:numberValue,avatar_url:photo}}});
      if(authError){
        console.error("Signup error:",authError);
        console.error("Signup error message:",authError?.message);
        console.error("Signup error details:",authError?.details);
        console.error("Signup error hint:",authError?.hint);
        console.error("Signup error code:",authError?.code);
        throw authError;
      }
      const user=authData?.user;
      if(!user)throw new Error("User account was not created.");
      if(!authData.session){
        setError("Account created. Check your email to confirm your account, then log in to continue.");
        return;
      }
      const profilePayload={id:user.id,full_name:fullName,email:emailValue,university:universityValue,department:departmentValue,level:numericLevel,number:numberValue||null,avatar_url:photo,bio:""};
      const {data:profile,error:profileError}=await client.from(PROFILE_TABLE).upsert(profilePayload,{onConflict:"id"}).select("id,full_name,email,university,department,level,avatar_url,bio,is_verified,verification_status,created_at,updated_at").single();
      if(profileError)throw profileError;
      onDone(normalizeProfile({...profile,number:profilePayload.number}));
    }catch(err){console.error("Boopa signup failed:",{message:err?.message,code:err?.code,status:err?.status});setError(authErrorMessage(err));}finally{setSaving(false);}
  };

  return (
    <div className="auth-shell">
      <div className="auth-top"><button className="back-btn" onClick={onBack}><Icon name="arrow-left"/></button><Wordmark/></div>
      <div className="auth-mid">
        <form className="auth-card" onSubmit={submit}>
          <h2>Join us</h2>
          <p className="sub">Set up your profile so other students can find and connect with you.</p>
          <div className="pfp-upload">
            <div className="pfp-circle" onClick={()=>fileRef.current.click()}>
              {photo ? <img src={photo} alt=""/> : <Icon name="camera" size={24}/>}
            </div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={pickPhoto}/>
            <span className="hint">Add a profile photo</span>
          </div>
          <div className="field">
            <label htmlFor="signup-name">Full name</label>
            <input id="signup-name" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Amaka Chukwu" required />
          </div>
          <div className="field">
            <label htmlFor="signup-level">Level</label>
            <select id="signup-level" value={level} onChange={e=>setLevel(e.target.value)} required>{LEVELS.map(item=><option key={item} value={item}>{item} Level</option>)}</select>
          </div>
          <div className="field">
            <label htmlFor="signup-department">Department</label>
            <input id="signup-department" value={department} onChange={e=>setDepartment(e.target.value)} placeholder="e.g. Medicine and Surgery" required />
          </div>
          <div className="field">
            <label htmlFor="signup-university">University</label>
            <input id="signup-university" value={university} onChange={e=>setUniversity(e.target.value)} placeholder="e.g. University of Lagos" required />
          </div>
          <div className="field">
            <label htmlFor="signup-email">Email</label>
            <input id="signup-email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" required />
          </div>
          <div className="field">
            <label htmlFor="signup-password">Password</label>
            <input id="signup-password" type="password" minLength="8" value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 8 characters" required />
          </div>
          <div className="field">
            <label htmlFor="signup-number">WhatsApp number</label>
            <input id="signup-number" type="tel" value={number} onChange={e=>setNumber(e.target.value)} placeholder="+234 800 000 0000" required />
          </div>
          <p className="field-note">Your number is only shared when another student chooses to connect with you.</p>
          {error&&<p className="verification-status error">{error}</p>}
          <button className="submit-btn" type="submit" disabled={saving}>{saving?"Creating your profile…":"Create my profile"}</button>
        </form>
      </div>
    </div>
  );
}

function Login({onBack,onDone}){
  const [number,setNumber] = useState("");
  const [email,setEmail] = useState(""); const [password,setPassword] = useState(""); const [error,setError] = useState(""); const [saving,setSaving] = useState(false);
  const submit = async e => {
    e.preventDefault();
    setError("");
    if(!email.trim()||!password){setError("Enter your email and password.");return;}
    setSaving(true);
    try{
      const client=requireClient();
      const {data,error:authError}=await client.auth.signInWithPassword({email:email.trim(),password});
      if(authError)throw authError;
      if(!data?.session||!data.user)throw new Error("Supabase did not create a login session.");
      const metadata=data.user.user_metadata||{};
      onDone(normalizeProfile({id:data.user.id,email:data.user.email,full_name:metadata.full_name||"",university:metadata.university||"",department:metadata.department||"",level:metadata.level||"",number:number.trim()||metadata.number||"",avatar_url:metadata.avatar_url||"",bio:metadata.bio||""}));
    }catch(err){console.error("Boopa login failed:",{message:err?.message,code:err?.code,status:err?.status});setError(authErrorMessage(err));}finally{setSaving(false);}
  };
  return <div className="auth-shell"><div className="auth-top"><button className="back-btn" onClick={onBack}><Icon name="arrow-left"/></button><Wordmark/></div><div className="auth-mid"><form className="auth-card" onSubmit={submit}>
    <h2>Welcome back</h2><p className="sub">Log in with your WhatsApp number to continue.</p>
    <div className="field" style={{marginTop:28}}><label htmlFor="login-email">Email</label><input id="login-email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" required /></div><div className="field"><label htmlFor="login-password">Password</label><input id="login-password" type="password" value={password} onChange={e=>setPassword(e.target.value)} required /></div><div className="field"><label htmlFor="login-number">WhatsApp number</label><input id="login-number" type="tel" value={number} onChange={e=>setNumber(e.target.value)} placeholder="+234 800 000 0000" /></div>
    {error&&<p className="verification-status error">{error}</p>}
    <button className="submit-btn" type="submit" disabled={saving}>{saving?"Signing you in…":"Log in"}</button><div className="auth-switch">New to Boopa? <button type="button" onClick={()=>onBack()}>Create a profile</button></div>
  </form></div></div>;
}

function PersonRow({student,onClick}){
  return <div className="row-item" onClick={onClick} role="button" tabIndex="0" onKeyDown={e=>e.key==="Enter"&&onClick()}><Avatar name={student.full_name} photo={student.avatar_url}/><div className="row-text"><div className="row-title">{student.full_name}{student.isVerified&&<VerifiedBadge/>}</div><div className="row-sub">{student.department} · {student.university}</div></div><span className="row-tag">{student.level}</span><Icon name="chevron" size={17}/></div>;
}

function Discover({onPerson}){
  const [query,setQuery] = useState(""); const [university,setUniversity] = useState("All universities"); const [level,setLevel] = useState("All levels"); const [department,setDepartment] = useState("All departments"); const [students,setStudents] = useState([]); const [loading,setLoading] = useState(true); const [error,setError] = useState("");
  const load=async()=>{try{const client=requireClient();const session=await getSession();if(!session)throw new Error("Please sign in to discover students.");const {data,error}=await client.from("public_profiles").select("id,full_name,university,department,level,avatar_url,bio,is_verified,verification_status,created_at,updated_at").neq("id",session.user.id).order("created_at",{ascending:false});if(error)throw error;setStudents((data||[]).map(normalizeProfile));}catch(err){setError(err.message);}finally{setLoading(false);}};
  useEffect(()=>{load();if(!supabaseClient)return;const channel=supabaseClient.channel("profiles-discover").on("postgres_changes",{event:"*",schema:"public",table:PROFILE_TABLE},load).subscribe();return()=>supabaseClient.removeChannel(channel);},[]);
  const results=students.filter(student=>(student.full_name+" "+(student.department||"")+" "+(student.university||"")).toLowerCase().includes(query.toLowerCase())&&(university==="All universities"||student.university===university)&&(level==="All levels"||student.level===level)&&(department==="All departments"||student.department===department));
  const universities=["All universities",...Array.from(new Set(students.map(student=>student.university).filter(Boolean)))]; const departments=["All departments",...Array.from(new Set(students.map(student=>student.department).filter(Boolean)))];

function Verification({profile,isVerified,status,onRefresh,onBack,onCompleted}){
  const [busy,setBusy]=useState(false); const [message,setMessage]=useState(""); const [messageType,setMessageType]=useState("");
  const publicKey=window.BOOPA_CONFIG&&window.BOOPA_CONFIG.paystackPublicKey;
  const functionUrl=name=>((window.BOOPA_CONFIG?.supabaseUrl||"").replace(/\/$/,"")+"/functions/v1/"+name);
  const paymentUrl=name=>((window.BOOPA_CONFIG?.paymentApiBaseUrl||"") .replace(/\/$/,"")+"/api/payments/"+name);
  const subscribe=async()=>{
    setBusy(true);setMessage("");setMessageType("");
    try{
      if(!publicKey) throw new Error("Paystack public key is missing from the deployment configuration.");
      if(!window.PaystackPop) throw new Error("Paystack checkout is unavailable. Please refresh and try again.");
      const headers=await authHeaders();
      console.log("PAYMENT_BACKEND_REQUEST_STARTED",{endpoint:"initialize-verification"});
      const response=await fetch(paymentUrl("initialize-verification"),{method:"POST",headers:{"Content-Type":"application/json",...headers},body:"{}"});
      const data=await response.json().catch(()=>({}));
      console.log("PAYMENT_BACKEND_RESPONSE_STATUS",{status:response.status});
      console.log("PAYMENT_BACKEND_RESPONSE_BODY",{body:data});
      if(!response.ok) throw new Error(data.error||"Unable to start payment. Please try again.");
      if(data.already_verified){await onRefresh();setMessage("Your payment is already verified.");setMessageType("success");setBusy(false);return;}
      const popup=new PaystackPop();
      if(!data.access_code||!data.authorization_url||!data.reference) throw new Error("Paystack did not return a valid checkout response.");
      popup.resumeTransaction(data.access_code,{onSuccess:async(transaction)=>{try{setMessage("Payment received. Confirming your subscription…");setMessageType("");const reference=transaction?.reference||data.reference;if(!reference)throw new Error("Payment could not be verified. Please try again.");const confirmation=await fetch(paymentUrl("verify-verification")+"?reference="+encodeURIComponent(reference),{method:"GET",headers:await authHeaders()});const result=await confirmation.json().catch(()=>({}));if(!confirmation.ok)throw new Error(result.error||"Payment could not be verified. Please try again.");await onRefresh();setMessage("Payment successful! Your profile is now verified.");setMessageType("success");setBusy(false);if(onCompleted)setTimeout(onCompleted,800);}catch(error){console.error("Boopa payment confirmation failed:",error);setMessage(error?.message==="Failed to fetch"?"Payment service is unavailable. Please try again.":error.message||"Payment could not be verified. Please try again.");setMessageType("error");setBusy(false);}},onCancel:async()=>{await cancel(data.reference);}});
    }catch(error){console.error("PAYMENT_BACKEND_ERROR",{message:error?.message||"unknown"});console.error("Boopa verification initialization failed:",error);setMessage(error?.message==="Failed to fetch"?"Payment service is unavailable. Please try again.":error.message||"Unable to start payment. Please try again.");setMessageType("error");setBusy(false);}
  };
  const cancel=async(reference)=>{setBusy(true);setMessage("");setMessageType("");try{const response=await fetch(paymentUrl("cancel"),{method:"POST",headers:{"Content-Type":"application/json",...await authHeaders()},body:JSON.stringify(reference?{reference}:{})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||"Unable to cancel your subscription.");await onRefresh();setMessage("Payment cancelled. You can start again.");setMessageType("success");}catch(error){setMessage(error.message||"Unable to cancel your subscription.");setMessageType("error");}finally{setBusy(false);}};
  const resume=()=>{if(status?.pending_payment?.authorization_url)window.open(status.pending_payment.authorization_url,"_blank","noopener,noreferrer");else setMessage("This payment cannot be resumed. Start a new payment.");};
  const startNew=async()=>{if(status?.pending_payment?.reference)await cancel(status.pending_payment.reference);await subscribe();};
  return <div className="motion-in"><div className="row-back"><button className="back-btn" onClick={onBack} aria-label="Back"><Icon name="arrow-left" size={18}/></button><div><h2>Get Verified</h2><p>Build trust and stand out on Boopa.</p></div></div><div className="verification-card"><h3><VerifiedBadge/> Boopa Verified</h3><p>Get a blue verification badge on your profile and show other students that your account has an active verification subscription.</p><ul><li>Blue verification badge</li><li>More trust when connecting with students</li><li>Verification status checked automatically</li><li>Verified badge appears on your profile</li></ul><div className="info-row"><span>Price</span><b>₦200 / month</b></div><div className="info-row"><span>Plan</span><b>Monthly subscription</b></div>{isVerified?<><div className="verification-status success">You are already verified.</div><button className="cta-secondary" onClick={()=>cancel()} disabled={busy}>{busy?"Processing…":"Cancel subscription"}</button></>:status?.status==="pending"?<><div className="verification-status">A payment is waiting for completion.</div><button className="submit-btn" onClick={resume} disabled={busy}>Resume payment</button><button className="cta-secondary" onClick={startNew} disabled={busy}>Start new payment</button></>:<button className="submit-btn" onClick={subscribe} disabled={busy}>{busy?"Opening secure payment…":"Subscribe for ₦200/month"}</button>}{status&&status.error&&<div className="verification-status error">{status.error}</div>}{message&&<div className={"verification-status "+messageType}>{message}</div>}</div></div>;
}

  const loadConnection=async()=>{try{const session=await getSession();if(!session){setFriendStatus("none");setNumber("");return;}const {data}=await requireClient().from("friend_requests").select("status,sender_id,receiver_id").or("and(sender_id.eq."+session.user.id+",receiver_id.eq."+student.id+"),and(sender_id.eq."+student.id+",receiver_id.eq."+session.user.id+")").in("status",["pending","accepted"]).order("created_at",{ascending:false}).limit(1).maybeSingle();const nextStatus=data?.status==="accepted"?"accepted":data?.status==="pending"?(data.sender_id===session.user.id?"sent":"received"):"none";setFriendStatus(nextStatus);if(nextStatus==="accepted"){const result=await requireClient().rpc("get_profile_for_view",{target_user_id:student.id});if(result.error)throw result.error;setNumber(result.data?.[0]?.number||"");}else setNumber("");}catch(error){setFriendStatus("none");setNumber("");}};
  useEffect(()=>{let active=true;loadConnection();const channel=supabaseClient?.channel("friend-connection-"+student.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"friend_requests"},payload=>{const row=payload.new||{};if(active&&(row.sender_id===student.id||row.receiver_id===student.id))loadConnection();}).subscribe();return()=>{active=false;if(channel&&supabaseClient)supabaseClient.removeChannel(channel);};},[student.id]);
  const addFriend=async()=>{setMessage("");try{const session=await getSession();if(!session){setMessage("Please log in again to send a friend request.");return;}if(session.user.id===student.id){setMessage("You cannot send a friend request to yourself.");return;}const {data:existing,error:lookupError}=await requireClient().from("friend_requests").select("status,sender_id,receiver_id").or("and(sender_id.eq."+session.user.id+",receiver_id.eq."+student.id+"),and(sender_id.eq."+student.id+",receiver_id.eq."+session.user.id+")").in("status",["pending","accepted"]).maybeSingle();if(lookupError)throw lookupError;if(existing){setFriendStatus(existing.status==="accepted"?"accepted":existing.sender_id===session.user.id?"sent":"received");return;}const {error}=await requireClient().from("friend_requests").insert({sender_id:session.user.id,receiver_id:student.id,status:"pending"});if(error)throw error;setFriendStatus("sent");setMessage("Friend request sent.");}catch(error){console.error("Boopa friend request failed:",{message:error?.message,code:error?.code,status:error?.status});setMessage(error?.code==="23505"?"A friend request already exists.":"Unable to send friend request. Please try again.");}};
  const respondToFriend=async status=>{try{const session=await getSession();if(!session)throw new Error("Please log in again.");const {error}=await requireClient().from("friend_requests").update({status,updated_at:new Date().toISOString()}).eq("sender_id",student.id).eq("receiver_id",session.user.id).eq("status","pending");if(error)throw error;setFriendStatus(status==="accepted"?"accepted":"declined");setMessage(status==="accepted"?"Friend request accepted.":"Friend request declined.");if(status==="accepted"){const result=await requireClient().rpc("get_profile_for_view",{target_user_id:student.id});if(result.error)throw result.error;setNumber(result.data?.[0]?.number||"");}}catch(error){setMessage("Unable to update friend request. Please try again.");}};
  const connect=()=>window.open("https://wa.me/"+number.replace(/\D/g,""),"_blank","noopener,noreferrer");
  return <div className="profile-card"><div className="row-back"><button className="back-btn" onClick={onBack}><Icon name="arrow-left" size={18}/></button><h2>Student profile</h2></div><div className="profile-pfp"><Avatar name={student.full_name} photo={student.avatar_url} size={88}/><h2>{student.full_name}{student.isVerified&&<VerifiedBadge/>}</h2><div className="department">{student.department}</div><div className="university">{student.university}</div></div><div className="info-row"><span>Level</span><b>{student.level} Level</b></div><div className="info-row"><span>Bio</span><b>{student.bio||"No bio yet."}</b></div>{friendStatus==="accepted"&&<button className="submit-btn" onClick={()=>onMessage(student)}>Message</button>}{friendStatus==="accepted"&&number?<button className="wa-btn" onClick={connect}><Icon name="whatsapp" size={19}/> Connect on WhatsApp</button>:friendStatus==="received"?<div style={{display:"flex",gap:8}}><button className="submit-btn" onClick={()=>respondToFriend("accepted")}>Accept</button><button className="cta-secondary" onClick={()=>respondToFriend("declined")}>Decline</button></div>:<button className="submit-btn" onClick={addFriend} disabled={friendStatus!=="none"}>{friendStatus==="sent"?"Request Sent":friendStatus==="accepted"?"Connected":"Add Friend"}</button>}{message&&<div className="verification-status">{message}</div>}</div>;
}

function Messages({target,onBack}){
  const [items,setItems]=useState([]); const [text,setText]=useState(""); const [loading,setLoading]=useState(true); const [error,setError]=useState(""); const [sending,setSending]=useState(false); const bodyRef=useRef(null); const nearBottom=useRef(true);
  if(!target)return <div className="motion-in"><div className="page-head"><h2>Messages</h2><p>Open a connected student's profile to start a conversation.</p></div><EmptyState icon="feed" title="No conversation selected" body="Your messages will appear here when you choose Message from a connected profile."/></div>;
  const load=async()=>{try{const session=await getSession();if(!session)throw new Error("Please log in again.");const client=requireClient();const {data,error:queryError}=await client.from("messages").select("id,sender_id,receiver_id,content,is_read,created_at").or("and(sender_id.eq."+session.user.id+",receiver_id.eq."+target.id+"),and(sender_id.eq."+target.id+",receiver_id.eq."+session.user.id+")").order("created_at",{ascending:true});if(queryError)throw queryError;setItems(data||[]);await client.from("messages").update({is_read:true}).eq("sender_id",target.id).eq("receiver_id",session.user.id).eq("is_read",false);}catch(err){setError(err.message||"Unable to load messages.");}finally{setLoading(false);}};
  useEffect(()=>{load();const client=requireClient();const channel=client.channel("conversation-"+target.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{const row=payload.new;if(row&&(row.sender_id===target.id||row.receiver_id===target.id)){setItems(current=>current.some(item=>item.id===row.id)?current:[...current,row]);if(row.sender_id===target.id)client.from("messages").update({is_read:true}).eq("id",row.id);}}).subscribe();return()=>{client.removeChannel(channel);};},[target.id]);
  useEffect(()=>{if(nearBottom.current&&bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight;},[items]);
  const send=async e=>{e.preventDefault();const body=text.trim();if(!body||sending)return;setError("");setSending(true);try{const session=await getSession();if(!session)throw new Error("Please log in again.");if(session.user.id===target.id)throw new Error("You cannot message yourself.");const {data:connection,error:connectionError}=await requireClient().from("friend_requests").select("id").or("and(sender_id.eq."+session.user.id+",receiver_id.eq."+target.id+"),and(sender_id.eq."+target.id+",receiver_id.eq."+session.user.id+")").eq("status","accepted").limit(1);if(connectionError)throw connectionError;if(!connection?.length)throw new Error("Connect with this student before messaging them.");const {error:sendError}=await requireClient().from("messages").insert({sender_id:session.user.id,receiver_id:target.id,content:body,is_read:false});if(sendError)throw sendError;setText("");}catch(err){setError(err.message||"Unable to send message.");}finally{setSending(false);}};
  return <div className="motion-in chat-shell"><div className="chat-head"><button className="back-btn" onClick={onBack} aria-label="Back">←</button><Avatar name={target.full_name} photo={target.avatar_url} size={42}/><div><h2>{target.full_name}</h2><div className="chat-status">Connected</div></div></div><div ref={bodyRef} className="chat-body" onScroll={e=>{const el=e.currentTarget;nearBottom.current=el.scrollHeight-el.scrollTop-el.clientHeight<80;}}>{loading?[1,2,3].map(item=><div className="skeleton" key={item}/>):error?<EmptyState icon="feed" title="Unable to load messages" body={error}/>:items.length?items.map(item=><div key={item.id} className={"chat-bubble-row "+(item.sender_id===target.id?"":"mine")}><div className="chat-bubble"><div>{item.content}</div><div className="chat-time">{new Date(item.created_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</div></div></div>):<div className="chat-empty"><Avatar name={target.full_name} photo={target.avatar_url} size={58}/><b>You and {target.full_name} are connected</b><div>Start a conversation 👋</div></div>}</div><form className="chat-composer" onSubmit={send}><input value={text} onChange={e=>setText(e.target.value)} placeholder={"Message "+target.full_name+"…"} aria-label="Message" onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.currentTarget.form.requestSubmit();}}}/><button className="submit-btn" type="submit" disabled={sending||!text.trim()}>{sending?"…":"Send"}</button></form></div>;
}

function App({profile,onLogout}){
  const [currentProfile,setCurrentProfile]=useState(profile); const [tab,setTab]=useState("discover"); const [selected,setSelected]=useState(null); const [theme,setTheme]=useState(localStorage.getItem("boopa-theme")||"light"); const [status,setStatus]=useState(null); const [notificationCount,setNotificationCount]=useState(0); const [notificationRefresh,setNotificationRefresh]=useState(0); const [notificationToast,setNotificationToast]=useState("");
  useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem("boopa-theme",theme)},[theme]);
  useEffect(()=>{let active=true;(async()=>{try{const {data,error}=await requireClient().rpc("get_profile_for_view",{target_user_id:profile.id});if(error)throw error;if(active&&data?.[0])setCurrentProfile(normalizeProfile(data[0]));}catch(error){console.error("Boopa profile hydration failed:",{message:error?.message,code:error?.code,status:error?.status});}})();return()=>{active=false;};},[profile.id]);
  useEffect(()=>{let active=true;const client=requireClient();(async()=>{const session=await getSession();if(!session||session.user.id!==profile.id)return;const {count,error}=await client.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",profile.id).is("read_at",null);if(!error&&active)setNotificationCount(count||0);})();const channel=client.channel("user-notifications-"+profile.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+profile.id},payload=>{if(!active)return;setNotificationCount(count=>count+1);setNotificationRefresh(value=>value+1);setNotificationToast(payload.new?.message||"You have a new notification.");setTimeout(()=>setNotificationToast(""),4500);}).subscribe();return()=>{active=false;client.removeChannel(channel);};},[profile.id]);
  useEffect(()=>{const onPushClick=event=>{if(event.data?.type==="BOOPA_NOTIFICATION_CLICK"&&event.data.url)window.location.href=event.data.url;};navigator.serviceWorker?.addEventListener("message",onPushClick);return()=>navigator.serviceWorker?.removeEventListener("message",onPushClick);},[]);
  useEffect(()=>{const params=new URLSearchParams(window.location.search);const userId=params.get("user_id");if(params.get("open")==="messages"&&userId){requireClient().rpc("get_profile_for_view",{target_user_id:userId}).then(result=>{if(!result.error&&result.data?.[0])setSelected({type:"messages",value:normalizeProfile(result.data[0])});});}},[]);
  const refreshStatus=async()=>{try{const base=(window.BOOPA_CONFIG?.paymentApiBaseUrl||"").replace(/\/$/,"");const response=await fetch(base+"/api/payments/status",{headers:await authHeaders()});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||("Subscription status failed ("+response.status+")."));setStatus(result);}catch(error){console.error("Boopa verification status failed:",error);setStatus({status:"unavailable",error:error.message||"Unable to load subscription status. Please try again."});}};
  useEffect(()=>{refreshStatus();},[]);
  const isVerified=!!status&&status.status==="active";
  const saveProfile=async value=>{try{const {data,error}=await requireClient().from(PROFILE_TABLE).update({full_name:value.full_name,university:value.university,department:value.department,level:value.level,email:value.email,bio:value.bio||""}).eq("id",currentProfile.id).select("id,full_name,email,university,department,level,avatar_url,bio,is_verified,verification_status,created_at,updated_at").single();if(error)throw error;setCurrentProfile(normalizeProfile({...data,number:currentProfile.number}));}catch(error){console.error("Boopa profile update failed:",error);window.alert("We could not save your profile. Please try again.");throw error;}};
  const openCommunity=community=>{setSelected({type:"community",value:community});setTab("communities")};
  const content=selected?(selected.type==="person"?<PersonProfile student={selected.value} onBack={()=>setSelected(null)} onMessage={student=>setSelected({type:"messages",value:student})}/>:selected.type==="messages"?<Messages target={selected.value} onBack={()=>setSelected(null)}/>:<CommunityDetail community={selected.value} onBack={()=>setSelected(null)}/>):tab==="discover"?<Discover onPerson={student=>{if(student.id===profile.id){setTab("profile");return;}setSelected({type:"person",value:student});}}/>:tab==="communities"?<Communities onOpen={openCommunity}/>:tab==="feed"?<Feed onOpen={openCommunity}/>:tab==="notifications"?<Notifications refreshKey={notificationRefresh}/>:tab==="verification"?<Verification profile={currentProfile} isVerified={isVerified} status={status} onRefresh={refreshStatus} onBack={()=>setTab("profile")} onCompleted={()=>setTab("profile")}/>:<Profile profile={currentProfile} onLogout={onLogout} onSave={saveProfile} isVerified={isVerified} onOpenVerification={()=>setTab("verification")}/>;
  const nav=[{id:"discover",icon:"compass",label:"Discover"},{id:"communities",icon:"users",label:"Communities"},{id:"feed",icon:"feed",label:"Feed"},{id:"notifications",icon:"bell",label:"Alerts"},{id:"profile",icon:"user",label:"Profile"}];
  return <div className="app">{notificationToast&&<div className="verification-status success" style={{position:"fixed",top:16,left:16,right:16,zIndex:20,textAlign:"center"}}>{notificationToast}</div>}<header className="app-top"><Wordmark/><div style={{marginLeft:"auto",display:"flex",gap:8}}><button className="back-btn" aria-label="Toggle theme" onClick={()=>setTheme(theme==="dark"?"light":"dark")}>{theme==="dark"?"☼":"☾"}</button><button className="back-btn" aria-label="Log out" onClick={onLogout}><Icon name="arrow-left" size={17}/></button></div></header><main className={"app-content "+(selected?.type==="messages"?"chat-mode":"")}>{content}</main><nav className="bottom-nav">{nav.map(item=><button key={item.id} className={tab===item.id&&!selected?"active":""} onClick={()=>{setSelected(null);setTab(item.id);if(item.id==="notifications")setNotificationCount(0)}}><Icon name={item.icon} size={19}/>{item.label}{item.id==="notifications"&&notificationCount>0&&<span style={{marginLeft:4,fontSize:11,fontWeight:700}}>{notificationCount}</span>}</button>)}</nav></div>;
}

function Root(){
  const [screen,setScreen]=useState("landing"); const [profile,setProfile]=useState(null); const [loading,setLoading]=useState(true); const [startupError,setStartupError]=useState("");
  useEffect(()=>{if(!supabaseClient){setStartupError("Supabase is not configured for this deployment.");setLoading(false);return;}let mounted=true;const timeout=new Promise(resolve=>setTimeout(()=>resolve(null),8000));(async()=>{try{const session=await Promise.race([getSession(),timeout]);if(session&&mounted){const metadata=session.user.user_metadata||{};setProfile(normalizeProfile({id:session.user.id,email:session.user.email,full_name:metadata.full_name||"",university:metadata.university||"",department:metadata.department||"",level:metadata.level||"",number:metadata.number||"",avatar_url:metadata.avatar_url||"",bio:metadata.bio||""}));setScreen("app");}}catch(error){console.error("Boopa startup authentication failed:",{message:error?.message,code:error?.code,status:error?.status});if(mounted)setStartupError("We could not restore your session. You can still log in again.");}finally{if(mounted)setLoading(false);}})();const {data}=supabaseClient.auth.onAuthStateChange((_event,session)=>{if(!mounted)return;if(!session){setProfile(null);setScreen("landing");}});return()=>{mounted=false;data.subscription.unsubscribe();};},[]);
  const finish=value=>{setProfile(value);setScreen("app")};
  if(screen==="signup") return <SignUp onBack={()=>setScreen("landing")} onDone={finish}/>;
  if(screen==="login") return <Login onBack={()=>setScreen("signup")} onDone={finish}/>;
  if(loading) return <div className="landing"><div className="landing-mid"><div className="landing-box"><div className="skeleton"/></div></div></div>;
  if(screen==="app"&&profile) return <App profile={profile} onLogout={async()=>{if(supabaseClient)await supabaseClient.auth.signOut();setProfile(null);setScreen("landing")}} />;
  return <><Landing onSignup={()=>setScreen("signup")} onLogin={()=>setScreen("login")}/>{startupError&&<div className="verification-status error" style={{position:"fixed",bottom:12,left:12,right:12,textAlign:"center"}}>{startupError}</div>}</>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
