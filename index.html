<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boopa — Find Your People</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="/config.js"></script>
<style>
  :root{
    --primary:#3730A3;
    --primary-dark:#2A2482;
    --primary-soft:#F1F0FA;
    --accent:#131316;
    --accent-ink:#FFFFFF;
    --bg:#FBFBFC;
    --surface:#FFFFFF;
    --text:#131316;
    --text-muted:#78767F;
    --border:#E7E6EA;
    --success:#1B9C63;
    --success-soft:#E7F7EF;
    --danger:#C0392B;
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:16px;
    --font-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
    --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#111013;--surface:#19181C;--text:#F3F2F5;--text-muted:#9A98A2;--border:#2C2A30;--primary-soft:#221F3D;--accent:#F3F2F5;--accent-ink:#131316;
    }
  }
  :root[data-theme="dark"]{--bg:#111013;--surface:#19181C;--text:#F3F2F5;--text-muted:#9A98A2;--border:#2C2A30;--primary-soft:#221F3D;--accent:#F3F2F5;--accent-ink:#131316;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-width:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  #root{min-height:100vh;}
  h1{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
  h2,h3,h4{font-family:var(--font-body);font-weight:600;margin:0;letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:var(--font-body);cursor:pointer;touch-action:manipulation;}
  a{color:inherit;text-decoration:none;}
  input,select{font-family:var(--font-body);max-width:100%;}
  button,input,select{transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease,color .2s ease,transform .2s ease,opacity .2s ease;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 28%,transparent);outline-offset:2px;}

  /* ---- brand ---- */
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:9px;letter-spacing:-0.01em;}
  .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);flex-shrink:0;}

  /* ---- Landing ---- */
  .landing{min-height:100vh;display:flex;flex-direction:column;background:var(--surface);position:relative;isolation:isolate;overflow:hidden;}
  .landing::before,.landing::after{content:"";position:absolute;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(10px);will-change:transform,opacity;}
  .landing::before{width:min(58vw,720px);height:min(58vw,720px);left:50%;top:43%;background:radial-gradient(circle,color-mix(in srgb,var(--primary) 13%,transparent) 0%,transparent 68%);transform:translate(-50%,-50%);animation:landing-glow 16s ease-in-out infinite alternate;opacity:.7;}
  .landing::after{width:min(35vw,460px);height:min(35vw,460px);right:-14%;top:8%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 9%,transparent) 0%,transparent 70%);animation:landing-orbit 22s ease-in-out infinite alternate;opacity:.45;}
  .landing-nav{padding:26px 6vw;animation:landing-nav-in .45s cubic-bezier(.2,.8,.2,1) both;}
  .landing-nav .wordmark{transition:transform .25s ease,opacity .25s ease;}
  .landing-nav .wordmark:hover{transform:translateY(-1px);}
  .landing-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:6vh 6vw;position:relative;}
  .landing-mid::before{content:"";position:absolute;width:min(38vw,520px);height:min(38vw,520px);border:1px solid color-mix(in srgb,var(--text) 4%,transparent);border-radius:50%;opacity:.35;animation:landing-ring 20s linear infinite;pointer-events:none;}
  .landing-box{max-width:440px;text-align:center;animation:hero-breathe 8s ease-in-out 2.15s infinite;}
  .landing-box h1,.landing-box .tagline,.landing-box .pitch,.landing-lines span,.landing-cta button{opacity:0;animation:hero-item-in .65s cubic-bezier(.2,.8,.2,1) both;}
  .landing-box h1{font-size:clamp(34px,5.4vw,46px);line-height:1.08;font-weight:600;animation-delay:.42s;}
  .landing-box .tagline{font-size:15.5px;color:var(--text-muted);margin-top:8px;animation-delay:.62s;}
  .landing-box .pitch{font-size:15.5px;line-height:1.65;margin-top:24px;color:var(--text);max-width:36ch;margin-left:auto;margin-right:auto;animation-delay:.82s;}
  .landing-lines{margin-top:20px;display:flex;flex-direction:column;gap:3px;}
  .landing-lines span{font-size:12.5px;color:var(--text-muted);}
  .landing-lines span:first-child{animation-delay:1.04s;}
  .landing-lines span:last-child{animation-delay:1.12s;}
  .landing-cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:32px;}
  .cta-primary{background:var(--text);color:var(--surface);border:none;padding:13px 30px;border-radius:9px;font-weight:600;font-size:14.5px;min-height:46px;position:relative;overflow:hidden;box-shadow:0 8px 28px color-mix(in srgb,var(--text) 9%,transparent);animation-delay:1.32s!important;}
  .cta-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 28%,color-mix(in srgb,var(--surface) 20%,transparent) 48%,transparent 68%);transform:translateX(-125%);transition:transform .65s ease;}
  .cta-primary:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 12px 32px color-mix(in srgb,var(--text) 18%,transparent);}
  .cta-primary:hover::after{transform:translateX(125%);}
  .cta-primary:active{transform:translateY(0) scale(.975);}
  .cta-secondary{background:none;border:none;color:var(--text-muted);font-size:13.5px;font-weight:600;text-decoration:none;text-underline-offset:3px;position:relative;padding:4px 0;animation-delay:1.52s!important;}
  .cta-secondary::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:currentColor;transform:scaleX(.35);transform-origin:right center;transition:transform .25s ease,opacity .25s ease;opacity:.65;}
  .cta-secondary:hover{color:var(--text);transform:translateY(-1px);}
  .cta-secondary:hover::after,.cta-secondary:focus-visible::after{transform:scaleX(1);transform-origin:left center;opacity:1;}
  .landing-foot{padding:22px;text-align:center;font-size:11.5px;color:var(--text-muted);}
  @keyframes landing-nav-in{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes hero-item-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes hero-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes landing-glow{from{transform:translate(-50%,-50%) scale(.92);opacity:.45}to{transform:translate(-47%,-52%) scale(1.08);opacity:.8}}
  @keyframes landing-orbit{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(-8%,12%,0) scale(1.08)}}
  @keyframes landing-ring{from{transform:rotate(0deg) scale(.96)}to{transform:rotate(360deg) scale(1.04)}}
  @media(prefers-reduced-motion:reduce){
    .landing::before,.landing::after,.landing-mid::before,.landing-box{animation:none!important;}
    .landing-nav,.landing-box h1,.landing-box .tagline,.landing-box .pitch,.landing-lines span,.landing-cta button{animation:none!important;opacity:1!important;}
  }

  /* ---- Auth ---- */
  .auth-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .auth-top{padding:22px 6vw;display:flex;align-items:center;gap:14px;}
  .back-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);flex:0 0 auto;}
  .auth-mid{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:2vh 6vw 6vh;}
  .auth-card{width:100%;max-width:420px;}
  .auth-card h2{font-size:27px;}
  .auth-card .sub{color:var(--text-muted);font-size:14px;margin-top:6px;}
  .pfp-upload{margin:26px 0 6px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .pfp-circle{width:84px;height:84px;border-radius:50%;background:var(--primary-soft);border:1.5px dashed var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;overflow:hidden;position:relative;}
  .pfp-circle img{width:100%;height:100%;object-fit:cover;}
  .pfp-upload .hint{font-size:12.5px;color:var(--text-muted);}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input,.field select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--text);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--primary);}
  .submit-btn{width:100%;background:var(--text);color:var(--surface);border:none;border-radius:9px;padding:13px;font-weight:600;font-size:14.5px;margin-top:8px;}
  .field-note{font-size:12px;color:var(--text-muted);margin-top:-8px;margin-bottom:16px;line-height:1.5;}
  .auth-switch{text-align:center;margin-top:20px;font-size:13.5px;color:var(--text-muted);}
  .auth-switch button{background:none;border:none;color:var(--primary);font-weight:700;font-size:13.5px;}

  /* ---- App shell ---- */
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .app-top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 6vw;display:flex;align-items:center;gap:14px;}
  .app-content{flex:1;max-width:920px;margin:0 auto;width:100%;padding:24px 6vw calc(100px + env(safe-area-inset-bottom));}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10;}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text-muted);font-size:11px;font-weight:600;padding:7px 6px;border-radius:10px;min-height:48px;}
  .bottom-nav button.active{color:var(--primary);}

  .page-head{margin-bottom:20px;}
  .page-head h2{font-size:24px;}
  .page-head p{color:var(--text-muted);margin-top:5px;font-size:14px;}
  .row-back{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .row-back h2{font-size:21px;}

  .search-box{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 15px;margin-bottom:14px;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;}
  .search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 10%,transparent);}
  .search-box input{border:none;outline:none;background:transparent;color:var(--text);font-size:14.5px;width:100%;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .filter-row select{padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-muted);min-height:40px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--text-muted);min-height:40px;}
  .chip.active{background:var(--text);color:var(--surface);border-color:var(--text);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:17px;}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;color:#fff;flex-shrink:0;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .verified-badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#2563EB;color:#fff;font-size:11px;font-weight:700;vertical-align:middle;margin-left:5px;box-shadow:0 0 0 2px var(--surface);animation:badge-in .35s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes badge-in{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
  .verification-card{border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;margin-top:20px;background:var(--surface);}
  .verification-card h3{display:flex;align-items:center;gap:7px;font-size:16px;}
  .verification-card p{font-size:13px;color:var(--text-muted);line-height:1.55;margin-top:7px;}
  .verification-card ul{padding-left:18px;margin:13px 0;color:var(--text-muted);font-size:13px;line-height:1.8;}
  .verification-status{font-size:12.5px;margin-top:10px;color:var(--text-muted);}
  .verification-status.success{color:var(--success);}.verification-status.error{color:var(--danger);}
  .edit-fields{margin-top:20px;border-top:1px solid var(--border);padding-top:18px;}
  .motion-in{animation:route-in .4s cubic-bezier(.2,.8,.2,1) both;will-change:opacity,transform;}
  .stagger-in{animation:row-in .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--item-index, 0) * 45ms);will-change:opacity,transform;}
  .clickable{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background-color .22s ease;}
  .submit-btn,.wa-btn,.cta-primary,.back-btn,.chip,.cta-secondary{transition:transform .18s ease,box-shadow .2s ease,background-color .2s ease,color .2s ease,opacity .2s ease;}
  .submit-btn:active,.wa-btn:active,.cta-primary:active,.back-btn:active,.chip:active,.cta-secondary:active,.bottom-nav button:active{transform:scale(.97);}
  .submit-btn:disabled,.wa-btn:disabled{cursor:wait;opacity:.65;}
  .toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:13px;z-index:20;animation:toast-in .3s cubic-bezier(.2,.8,.2,1) both;max-width:min( calc(100vw - 32px), 420px);text-align:center;}
  .skeleton{height:52px;border-radius:10px;background:linear-gradient(100deg,var(--bg) 20%,var(--border) 40%,var(--bg) 60%);background-size:250% 100%;animation:shimmer 1.3s ease-in-out infinite;}
  .avatar img,.pfp-circle img{animation:image-in .35s ease both;}
  @keyframes route-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes row-in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  @keyframes image-in{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes shimmer{to{background-position:-200% 0}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  .list{display:flex;flex-direction:column;}
  .row-item{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--border);cursor:pointer;min-width:0;}
  .row-item:hover{background:var(--bg);}
  .row-text{flex:1;min-width:0;}
  .row-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-tag{flex-shrink:0;font-size:11px;color:var(--text-muted);border:1px solid var(--border);padding:3px 8px;border-radius:6px;}
  .row-item svg{color:var(--text-muted);flex-shrink:0;}

  .comm-mark{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--surface);font-family:var(--font-display);font-weight:600;font-size:15px;flex-shrink:0;}

  .notice-banner{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:18px;min-width:0;}
  .notice-banner>div:last-child{min-width:0;}
  .notice-banner b{font-size:13px;display:block;font-weight:600;}
  .notice-banner span{font-size:12.5px;color:var(--text-muted);}
  .feed-item{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--border);min-width:0;animation:row-in .4s cubic-bezier(.2,.8,.2,1) both;}
  .feed-item>div:last-child{min-width:0;overflow-wrap:anywhere;}
  .feed-item .fi-body{font-size:13.5px;line-height:1.55;margin-top:3px;}
  .feed-item .fi-meta{font-size:12px;color:var(--text-muted);margin-top:6px;}

  .profile-card{max-width:420px;margin:0 auto;}
  .profile-pfp{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 22px;}
  .profile-pfp h2{font-size:22px;margin-top:14px;}
  .profile-pfp .dept{font-size:14.5px;font-weight:500;margin-top:4px;}
  .profile-pfp .uni{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .info-row span:first-child{color:var(--text-muted);}
  .info-row:last-child{border-bottom:none;}
  .wa-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--success);color:#fff;border:none;border-radius:9px;padding:13px;font-weight:600;font-size:14px;margin-top:20px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty-state .glyph{width:52px;height:52px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .empty-state h4{color:var(--text);font-size:15.5px;margin-bottom:5px;}

  @media (hover:hover){
    .clickable:hover,.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(19,19,22,.08);}
    .back-btn:hover{border-color:var(--primary);color:var(--primary);}
    .chip:hover{border-color:var(--primary);color:var(--primary);}
  }
  @media(max-width:640px){
    .landing-nav{padding:20px 18px;}
    .landing-mid{align-items:flex-start;padding:12vh 18px 6vh;}
    .landing-box{max-width:100%;}
    .landing-box .pitch{font-size:14.5px;}
    .landing-foot{padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
    .auth-top{padding:18px;}
    .auth-mid{padding:2vh 18px calc(5vh + env(safe-area-inset-bottom));}
    .auth-card h2{font-size:25px;}
    .app-content{padding:20px 18px calc(104px + env(safe-area-inset-bottom));}
    .app-top{padding:14px 18px;}
    .page-head h2{font-size:22px;}
    .filter-row{display:grid;grid-template-columns:1fr;gap:8px;}
    .filter-row select{width:100%;}
    .row-item{gap:10px;padding:14px 2px;}
    .row-tag{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .row-sub{padding-right:2px;}
    .notice-banner{align-items:flex-start;padding:12px;}
    .notice-banner .comm-mark{margin-top:1px;}
    .feed-item{padding:14px 2px;}
    .feed-item .fi-body{font-size:13px;}
    .profile-card{width:100%;}
    .info-row{gap:18px;}
    .info-row b{max-width:65%;text-align:right;overflow-wrap:anywhere;}
    .bottom-nav button{font-size:10px;}
  }
  @media(max-width:360px){
    .app-content{padding-left:14px;padding-right:14px;}
    .app-top{padding-left:14px;padding-right:14px;}
    .bottom-nav{padding-left:2px;padding-right:2px;}
    .bottom-nav button{padding-left:2px;padding-right:2px;font-size:9px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect} = React;
const BOOPA_CONFIG = window.BOOPA_CONFIG || {};
const supabaseClient = BOOPA_CONFIG.supabaseUrl && BOOPA_CONFIG.supabasePublishableKey
  ? window.supabase.createClient(BOOPA_CONFIG.supabaseUrl, BOOPA_CONFIG.supabasePublishableKey)
  : null;
const PROFILE_TABLE = "profiles";
const getSession = async () => supabaseClient ? (await supabaseClient.auth.getSession()).data.session : null;
const requireClient = () => {
  if (!supabaseClient) throw new Error("Supabase is not configured for this deployment.");
  return supabaseClient;
};

function SignUp({onBack,onDone}){

  const [dept,setDept] = useState(DEPTS[0]);

  const [email,setEmail] = useState("");
  const [password,setPassword] = useState("");
  const [error,setError] = useState("");
  const fileRef = useRef(null);

  const pickPhoto = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => setPhoto(reader.result);
    reader.readAsDataURL(file);
  };

  const submit = async (e) => {
    e.preventDefault();
    if(!name.trim() || !number.trim()) return;
    try{
      const client=requireClient(); const {data,error:authError}=await client.auth.signUp({email:email.trim(),password});
      if(authError)throw authError; if(!data.user)throw new Error("Unable to create your account.");
      const {error:profileError}=await client.from(PROFILE_TABLE).insert({id:data.user.id,name:name.trim(),level,dept,uni,number:number.trim(),email:email.trim(),avatar_url:photo});
      if(profileError)throw profileError;
      onDone({id:data.user.id,name:name.trim(),level,dept,uni,number:number.trim(),email:email.trim(),photo});

          <div className="pfp-upload">
            <div className="pfp-circle" onClick={()=>fileRef.current.click()}>
              {photo ? <img src={photo} alt=""/> : <Icon name="camera" size={24}/>}
            </div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={pickPhoto}/>
            <span className="hint">Add a profile photo</span>
          </div>
          <div className="field">
            <label htmlFor="signup-name">Full name</label>
            <input id="signup-name" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Amaka Chukwu" required />
          </div>
          <div className="field">
            <label htmlFor="signup-level">Level</label>
            <select id="signup-level" value={level} onChange={e=>setLevel(e.target.value)}>{LEVELS.map(item=><option key={item}>{item}</option>)}</select>
          </div>
          <div className="field">
            <label htmlFor="signup-dept">Department</label>
            <select id="signup-dept" value={dept} onChange={e=>setDept(e.target.value)}>{DEPTS.map(item=><option key={item}>{item}</option>)}</select>
          </div>
          <div className="field">
            <label htmlFor="signup-uni">University</label>
            <select id="signup-uni" value={uni} onChange={e=>setUni(e.target.value)}>{UNIVERSITIES.map(item=><option key={item}>{item}</option>)}</select>
          </div>
          <div className="field">
            <label htmlFor="signup-email">Email</label>
            <input id="signup-email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" required />
          </div>
          <div className="field">
            <label htmlFor="signup-password">Password</label>
            <input id="signup-password" type="password" minLength="8" value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 8 characters" required />
          </div>
          <div className="field">
            <label htmlFor="signup-number">WhatsApp number</label>
            <input id="signup-number" type="tel" value={number} onChange={e=>setNumber(e.target.value)} placeholder="+234 800 000 0000" required />

        </form>

  );

function Verification({profile,isVerified,status,onRefresh}){
  const [busy,setBusy]=useState(false); const [message,setMessage]=useState("");
  const publicKey=window.BOOPA_CONFIG&&window.BOOPA_CONFIG.paystackPublicKey;
  const subscribe=async()=>{
    setBusy(true);setMessage("");
    try{
      const response=await fetch("/functions/v1/verification-initialize",{method:"POST",headers:{"Content-Type":"application/json",...authHeaders()},body:JSON.stringify({email:profile.email})});
      if(!response.ok) throw new Error("Unable to start verification checkout.");
      const data=await response.json();
      if(!publicKey||!window.PaystackPop) throw new Error("Paystack is not configured for this deployment.");
      const popup=new PaystackPop();
      popup.resumeTransaction(data.access_code,{onSuccess:async(transaction)=>{setMessage("Payment received. Confirming your subscription…");const confirmation=await fetch("/functions/v1/verification-confirm",{method:"POST",headers:{"Content-Type":"application/json",...authHeaders()},body:JSON.stringify({reference:transaction.reference})});if(!confirmation.ok)throw new Error("Payment could not be verified yet.");await onRefresh();setBusy(false);},onCancel:()=>{setMessage("Payment was cancelled.");setBusy(false);}});
    }catch(error){setMessage(error.message);setBusy(false);}
  };
  const cancel=async()=>{setBusy(true);setMessage("");try{const response=await fetch("/functions/v1/verification-cancel",{method:"POST",headers:authHeaders()});if(!response.ok)throw new Error("Unable to cancel your subscription.");await onRefresh();setMessage("Your subscription cancellation request was sent.");}catch(error){setMessage(error.message);}finally{setBusy(false);}};
  return <div className="verification-card"><h3><VerifiedBadge/> Get Verified</h3><p>Stand out with a blue verification badge that confirms your Boopa profile has an active subscription.</p><ul><li>Blue badge beside your name</li><li>More trust when connecting with students</li><li>Active subscription checked automatically</li></ul>{isVerified?<><div className="verification-status success">Your verification is active{status.next_payment_date?" · renews "+new Date(status.next_payment_date).toLocaleDateString():""}.</div><button className="cta-secondary" onClick={cancel} disabled={busy}>{busy?"Processing…":"Cancel subscription"}</button></>:<><button className="submit-btn" onClick={subscribe} disabled={busy}>{busy?"Opening checkout…":"Subscribe for Verification · ₦500/month"}</button>{status&&status.status&&<div className={"verification-status "+(status.status==="failed"?"error":"")}>Subscription status: {status.status}.</div>}</>}{message&&<div className="verification-status">{message}</div>}</div>;
}

function Profile({profile,onLogout,onSave,isVerified,status,onRefresh}){
  const [editing,setEditing]=useState(false); const [draft,setDraft]=useState(profile);
  const update=key=>e=>setDraft({...draft,[key]:e.target.value});
  const save=e=>{e.preventDefault();onSave(draft);setEditing(false);};
  return <div className="profile-card"><div className="profile-pfp"><Avatar name={profile.name} photo={profile.photo} size={88}/><h2>{profile.name}{isVerified&&<VerifiedBadge/>}</h2><div className="dept">{profile.dept}</div><div className="uni">{profile.uni}</div></div>{editing?<form className="edit-fields" onSubmit={save}><div className="field"><label htmlFor="edit-name">Name</label><input id="edit-name" value={draft.name} onChange={update("name")} required /></div><div className="field"><label htmlFor="edit-email">Email for billing</label><input id="edit-email" type="email" value={draft.email||""} onChange={update("email")} placeholder="you@example.com" required /></div><button className="submit-btn" type="submit">Save changes</button></form>:<><div className="info-row"><span>Level</span><b>{profile.level}</b></div><div className="info-row"><span>WhatsApp</span><b>{profile.number}</b></div><Verification profile={profile} isVerified={isVerified} status={status} onRefresh={onRefresh}/><button className="cta-secondary" onClick={()=>setEditing(true)} style={{marginTop:16}}>Edit profile</button></>}<button className="submit-btn" onClick={onLogout} style={{marginTop:20}}>Log out</button></div>;
}

function PersonProfile({student,onBack}){
  const [friendStatus,setFriendStatus]=useState("loading"); const [message,setMessage]=useState("");
  useEffect(()=>{(async()=>{try{const session=await getSession();const {data}=await requireClient().from("friend_requests").select("status,sender_id,receiver_id").or("and(sender_id.eq."+session.user.id+",receiver_id.eq."+student.id+"),and(sender_id.eq."+student.id+",receiver_id.eq."+session.user.id+")").order("created_at",{ascending:false}).limit(1).maybeSingle();setFriendStatus(data?.status==="accepted"?"accepted":data?.sender_id===session.user.id?"sent":data?.status||"none");}catch(error){setFriendStatus("none");}})();},[student.id]);
  const addFriend=async()=>{try{const session=await getSession();const {error}=await requireClient().from("friend_requests").insert({sender_id:session.user.id,receiver_id:student.id,status:"pending"});if(error)throw error;setFriendStatus("sent");setMessage("Friend request sent.");}catch(error){setMessage(error.message);}};
  const connect=()=>window.open("https://wa.me/"+student.number.replace(/\D/g,""),"_blank","noopener,noreferrer");
  return <div className="profile-card"><div className="row-back"><button className="back-btn" onClick={onBack}><Icon name="arrow-left" size={18}/></button><h2>Student profile</h2></div><div className="profile-pfp"><Avatar name={student.name} photo={student.photo} size={88}/><h2>{student.name}{student.isVerified&&<VerifiedBadge/>}</h2><div className="dept">{student.dept}</div><div className="uni">{student.uni}</div></div><div className="info-row"><span>Level</span><b>{student.level}</b></div><div className="info-row"><span>Community</span><b>{student.community||"Student"}</b></div>{friendStatus==="accepted"?<button className="wa-btn" onClick={connect}><Icon name="whatsapp" size={19}/> Connect on WhatsApp</button>:<button className="submit-btn" onClick={addFriend} disabled={friendStatus!=="none"}>{friendStatus==="sent"?"Request Sent":friendStatus==="accepted"?"Friends":"Add Friend"}</button>}{message&&<div className="verification-status">{message}</div>}</div>;
}

function App({profile,onLogout}){
  const [tab,setTab]=useState("discover"); const [selected,setSelected]=useState(null); const [theme,setTheme]=useState(localStorage.getItem("boopa-theme")||"light"); const [status,setStatus]=useState(null);
  useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem("boopa-theme",theme)},[theme]);
  const refreshStatus=async()=>{try{const response=await fetch("/functions/v1/verification-status",{headers:authHeaders()});if(!response.ok)throw new Error("status unavailable");setStatus(await response.json());}catch(error){setStatus({status:"unavailable"});}};
  useEffect(()=>{refreshStatus();},[]);
  const isVerified=!!status&&status.status==="active";
  const saveProfile=value=>{localStorage.setItem("boopa-profile",JSON.stringify(value));window.location.reload();};
  const openCommunity=community=>{setSelected({type:"community",value:community});setTab("communities")};
  const content=selected?(selected.type==="person"?<PersonProfile student={selected.value} onBack={()=>setSelected(null)}/>:<CommunityDetail community={selected.value} onBack={()=>setSelected(null)}/>):tab==="discover"?<Discover onPerson={student=>setSelected({type:"person",value:student})}/>:tab==="communities"?<Communities onOpen={openCommunity}/>:tab==="feed"?<Feed onOpen={openCommunity}/>:tab==="notifications"?<Notifications/>:<Profile profile={profile} onLogout={onLogout} onSave={saveProfile} isVerified={isVerified} status={status} onRefresh={refreshStatus}/>;
  const nav=[{id:"discover",icon:"compass",label:"Discover"},{id:"communities",icon:"users",label:"Communities"},{id:"feed",icon:"feed",label:"Feed"},{id:"notifications",icon:"bell",label:"Alerts"},{id:"profile",icon:"user",label:"Profile"}];
  return <div className="app"><header className="app-top"><Wordmark/><div style={{marginLeft:"auto",display:"flex",gap:8}}><button className="back-btn" aria-label="Toggle theme" onClick={()=>setTheme(theme==="dark"?"light":"dark")}>{theme==="dark"?"☼":"☾"}</button><button className="back-btn" aria-label="Log out" onClick={onLogout}><Icon name="arrow-left" size={17}/></button></div></header><main className="app-content">{content}</main><nav className="bottom-nav">{nav.map(item=><button key={item.id} className={tab===item.id&&!selected?"active":""} onClick={()=>{setSelected(null);setTab(item.id)}}><Icon name={item.icon} size={19}/>{item.label}</button>)}</nav></div>;
}

function Root(){
  const [screen,setScreen]=useState("landing"); const [profile,setProfile]=useState(null); const [loading,setLoading]=useState(true);
  useEffect(()=>{if(!supabaseClient){setLoading(false);return;}let mounted=true;(async()=>{const session=await getSession();if(session){const {data}=await supabaseClient.from(PROFILE_TABLE).select("*").eq("id",session.user.id).maybeSingle();if(mounted&&data){setProfile(normalizeProfile(data));setScreen("app");}}if(mounted)setLoading(false);})();const {data}=supabaseClient.auth.onAuthStateChange((_event,session)=>{if(!session&&mounted){setProfile(null);setScreen("landing");}});return()=>{mounted=false;data.subscription.unsubscribe();};},[]);
  const finish=value=>{setProfile(value);setScreen("app")};
  if(screen==="signup") return <SignUp onBack={()=>setScreen("landing")} onDone={finish}/>;
  if(screen==="login") return <Login onBack={()=>setScreen("signup")} onDone={finish}/>;
  if(loading) return <div className="landing"><div className="landing-mid"><div className="landing-box"><div className="skeleton"/></div></div></div>;
  if(screen==="app"&&profile) return <App profile={profile} onLogout={async()=>{if(supabaseClient)await supabaseClient.auth.signOut();setProfile(null);setScreen("landing")}} />;
  return <Landing onSignup={()=>setScreen("signup")} onLogin={()=>setScreen("login")}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
